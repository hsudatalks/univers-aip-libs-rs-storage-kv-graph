[package]
name="univers-aip-lib-storage-kv-graph"
version="0.1.1"
edition="2021"
rust-version="1.89"
license="MIT"
description="Graph repository over a caller-provided public KV storage Port"
repository="https://github.com/hsudatalks/univers-aip-libs-rs-storage-kv-graph"
publish=["univers"]
readme="README.md"
include=["Cargo.toml","Cargo.lock","README.md","src/**","tests/**","scripts/**",".cargo/config.toml"]
[workspace]
members=["."]
resolver="2"
[dependencies]
async-trait="0.1"
serde_json="1"
univers-aip-contracts-data={version=">=1.0.0-rc.2, <1.0.0",registry="univers",default-features=false,features=["storage","storage-full"]}
[dev-dependencies]
futures="0.3"
tokio={version="1",features=["macros","rt-multi-thread"]}
